<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Result Analysis System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(to right,#36d1dc,#5b86e5);
}

.container{
    width:80%;
    max-width:850px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0px 0px 20px gray;
}

h1{
    text-align:center;
    color:#003366;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #999;
    border-radius:6px;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#004d99;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:25px;
}

th{
    background:#003366;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    text-align:center;
    border:1px solid #ccc;
}

tr:nth-child(even){
    background:#f2f2f2;
}

.result{
    margin-top:25px;
    background:#eaf7ff;
    padding:20px;
    border-left:5px solid #0066cc;
    border-radius:6px;
    font-size:18px;
}

@media(max-width:768px){

.container{
    width:95%;
}

table{
    font-size:14px;
}

}

</style>

</head>

<body>

<div class="container">

<h1>Student Result Analysis System</h1>

<label>Student Name</label>
<input type="text" id="name" placeholder="Enter Student Name">

<label>Register Number</label>
<input type="text" id="regno" placeholder="Enter Register Number">

<label>Maths Marks</label>
<input type="number" id="m1">

<label>Science Marks</label>
<input type="number" id="m2">

<label>Computer Marks</label>
<input type="number" id="m3">

<label>English Marks</label>
<input type="number" id="m4">

<label>Physics Marks</label>
<input type="number" id="m5">

<button onclick="analyzeResult()">Analyze Result</button>

<table id="resultTable" style="display:none;">

<tr>
<th>Student Name</th>
<th>Register No</th>
<th>Total</th>
<th>Average</th>
<th>Highest</th>
<th>Lowest</th>
<th>Grade</th>
</tr>

<tr>
<td id="rname"></td>
<td id="rreg"></td>
<td id="rtotal"></td>
<td id="ravg"></td>
<td id="rhigh"></td>
<td id="rlow"></td>
<td id="rgrade"></td>
</tr>

</table>

<div class="result" id="summary" style="display:none;"></div>

</div>

<script>

function analyzeResult(){

let student={

name:document.getElementById("name").value,
reg:document.getElementById("regno").value

};

let marks=[

Number(document.getElementById("m1").value),
Number(document.getElementById("m2").value),
Number(document.getElementById("m3").value),
Number(document.getElementById("m4").value),
Number(document.getElementById("m5").value)

];

if(student.name=="" || student.reg==""){

alert("Please enter student details.");
return;

}

for(let i=0;i<marks.length;i++){

if(marks[i]<0 || marks[i]>100 || isNaN(marks[i])){

alert("Enter valid marks (0-100).");
return;

}

}

let total=0;

for(let i=0;i<marks.length;i++){

total+=marks[i];

}

let average=total/marks.length;

let highest=Math.max(...marks);

let lowest=Math.min(...marks);

let grade="";

if(average>=90)
grade="A+";
else if(average>=80)
grade="A";
else if(average>=70)
grade="B";
else if(average>=60)
grade="C";
else if(average>=50)
grade="D";
else
grade="Fail";

document.getElementById("resultTable").style.display="table";

document.getElementById("summary").style.display="block";

document.getElementById("rname").innerHTML=student.name;
document.getElementById("rreg").innerHTML=student.reg;
document.getElementById("rtotal").innerHTML=total;
document.getElementById("ravg").innerHTML=average.toFixed(2);
document.getElementById("rhigh").innerHTML=highest;
document.getElementById("rlow").innerHTML=lowest;
document.getElementById("rgrade").innerHTML=grade;

document.getElementById("summary").innerHTML=

"<b>Analysis Summary</b><br><br>"+

"Total Marks : <b>"+total+"</b><br>"+

"Average Marks : <b>"+average.toFixed(2)+"</b><br>"+

"Highest Mark : <b>"+highest+"</b><br>"+

"Lowest Mark : <b>"+lowest+"</b><br>"+

"Final Grade : <b>"+grade+"</b>";

}

</script>

</body>
</html>
