<!DOCTYPE html>
<html>
<head>
    <title>Images, Hyperlinks, and Iframes</title>
</head>
<body>

    <h1 align="center">Images, Hyperlinks, and Iframes Demo</h1>

    <h2>Image Example</h2>
    <img src="student.jpg"
         alt="Student Image"
         width="250"
         height="250">

    <hr>

    <h2>Hyperlink Example</h2>
    <p>
        Click the link below to visit W3Schools:
    </p>

    <a href="https://www.w3schools.com" target="_blank">
        Visit W3Schools
    </a>

    <hr>

    <h2>Iframe Example</h2>
    <p>Embedded Webpage:</p>

    <iframe
        src="https://www.wikipedia.org"
        width="700"
        height="400">
    </iframe>

</body>
</html>
