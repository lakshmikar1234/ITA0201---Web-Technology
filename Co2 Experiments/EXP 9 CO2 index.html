<!DOCTYPE html>
<html>
<head>

<title>Shopping Cart</title>

<style>

body{
font-family:Arial;
background:linear-gradient(to right,#00c6ff,#0072ff);
}

.container{
width:500px;
margin:40px auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 0 15px gray;
}

h2{
text-align:center;
color:#003366;
}

select,input{
width:100%;
padding:10px;
margin:10px 0;
}

button{
width:100%;
padding:12px;
background:green;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th{
background:#003366;
color:white;
padding:10px;
}

td{
padding:10px;
text-align:center;
border:1px solid gray;
}

</style>

</head>

<body>

<div class="container">

<h2>Shopping Cart</h2>

<select id="product">
<option value="500">Laptop - ₹500</option>
<option value="200">Headphone - ₹200</option>
<option value="100">Mouse - ₹100</option>
</select>

<input type="number" id="qty" placeholder="Quantity">

<button onclick="bill()">Generate Bill</button>

<table>

<tr>

<th>Subtotal</th>
<th>Discount</th>
<th>Tax</th>
<th>Total</th>

</tr>

<tr>

<td id="sub"></td>
<td id="dis"></td>
<td id="tax"></td>
<td id="total"></td>

</tr>

</table>

</div>

<script>

function bill(){

let price=Number(document.getElementById("product").value);

let qty=Number(document.getElementById("qty").value);

let subtotal=price*qty;

let discount=subtotal*0.10;

let tax=(subtotal-discount)*0.05;

let total=subtotal-discount+tax;

document.getElementById("sub").innerHTML="₹"+subtotal;
document.getElementById("dis").innerHTML="₹"+discount.toFixed(2);
document.getElementById("tax").innerHTML="₹"+tax.toFixed(2);
document.getElementById("total").innerHTML="₹"+total.toFixed(2);

}

</script>

</body>
</html>
