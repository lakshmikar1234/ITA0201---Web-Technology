<?xml version="1.0" encoding="UTF-8"?>

<xsl:stylesheet version="1.0"
xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

<xsl:template match="/">

<html>

<head>

<title>Student Information</title>

<style>

body{
font-family:Arial;
background:linear-gradient(to right,#4facfe,#00f2fe);
margin:0;
padding:30px;
}

h1{
text-align:center;
color:white;
}

table{
width:85%;
margin:auto;
border-collapse:collapse;
background:white;
box-shadow:0px 0px 15px gray;
}

th{
background:#1e90ff;
color:white;
padding:12px;
font-size:18px;
}

td{
padding:10px;
text-align:center;
border:1px solid gray;
}

tr:nth-child(even){
background:#f2f2f2;
}

tr:hover{
background:#d6f5ff;
}

.footer{
width:85%;
margin:20px auto;
background:#1e90ff;
color:white;
text-align:center;
padding:12px;
font-weight:bold;
border-radius:6px;
}

</style>

</head>

<body>

<h1>Student Information System</h1>

<table>

<tr>
<th>Roll No</th>
<th>Name</th>
<th>Department</th>
<th>Year</th>
<th>Email</th>
<th>Mobile</th>
</tr>

<xsl:for-each select="students/student">

<tr>

<td><xsl:value-of select="rollno"/></td>

<td><xsl:value-of select="name"/></td>

<td><xsl:value-of select="department"/></td>

<td><xsl:value-of select="year"/></td>

<td><xsl:value-of select="email"/></td>

<td><xsl:value-of select="mobile"/></td>

</tr>

</xsl:for-each>

</table>

<div class="footer">
XML with XSL Design | Student Database
</div>

</body>

</html>

</xsl:template>

</xsl:stylesheet>
