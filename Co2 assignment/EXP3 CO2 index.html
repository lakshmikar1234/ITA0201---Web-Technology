<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scientific Calculator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(to right,#00c6ff,#0072ff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.calculator{

    width:380px;
    background:#ffffff;
    padding:20px;
    border-radius:15px;
    box-shadow:0px 0px 20px rgba(0,0,0,0.4);

}

h2{
    text-align:center;
    color:#003366;
    margin-bottom:15px;
}

#display{

    width:100%;
    height:60px;
    font-size:24px;
    text-align:right;
    padding:10px;
    border:2px solid #0072ff;
    border-radius:8px;
    margin-bottom:15px;

}

.buttons{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;

}

button{

padding:15px;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
background:#0072ff;
color:white;
transition:0.3s;

}

button:hover{

background:#0056cc;

}

.operator{

background:#ff9800;

}

.operator:hover{

background:#e68900;

}

.equal{

background:green;

}

.equal:hover{

background:darkgreen;

}

.clear{

background:red;

}

.clear:hover{

background:darkred;

}

</style>

</head>

<body>

<div class="calculator">

<h2>Scientific Calculator</h2>

<input type="text" id="display" readonly>

<div class="buttons">

<button onclick="clearDisplay()" class="clear">C</button>
<button onclick="deleteLast()">⌫</button>
<button onclick="append('%')">%</button>
<button onclick="append('/')" class="operator">/</button>

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button onclick="append('*')" class="operator">*</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button onclick="append('-')" class="operator">-</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button onclick="append('+')" class="operator">+</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button onclick="calculate()" class="equal">=</button>
<button onclick="append('(')">(</button>

<button onclick="append(')')">)</button>
<button onclick="square()">x²</button>
<button onclick="sqrt()">√</button>
<button onclick="power()">xʸ</button>

<button onclick="sin()">sin</button>
<button onclick="cos()">cos</button>
<button onclick="tan()">tan</button>
<button onclick="log()">log</button>

</div>

</div>

<script>

let display=document.getElementById("display");

function append(value){

display.value+=value;

}

function clearDisplay(){

display.value="";

}

function deleteLast(){

display.value=display.value.slice(0,-1);

}

function calculate(){

try{

display.value=eval(display.value);

}

catch{

display.value="Error";

}

}

function sqrt(){

display.value=Math.sqrt(eval(display.value));

}

function square(){

display.value=Math.pow(eval(display.value),2);

}

function power(){

let p=prompt("Enter Power");

display.value=Math.pow(eval(display.value),Number(p));

}

function sin(){

display.value=Math.sin(eval(display.value)*Math.PI/180);

}

function cos(){

display.value=Math.cos(eval(display.value)*Math.PI/180);

}

function tan(){

display.value=Math.tan(eval(display.value)*Math.PI/180);

}

function log(){

display.value=Math.log10(eval(display.value));

}

</script>

</body>
</html>
