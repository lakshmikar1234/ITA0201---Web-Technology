<!DOCTYPE html>
<html>
<head>

<title>To-Do List</title>

<style>

body{
font-family:Arial;
background:linear-gradient(to right,#00c6ff,#0072ff);
}

.container{
width:500px;
margin:40px auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 0 15px gray;
}

h2{
text-align:center;
color:#003366;
}

input{
width:75%;
padding:10px;
}

button{
padding:10px;
background:#0072ff;
color:white;
border:none;
cursor:pointer;
}

ul{
margin-top:20px;
list-style:none;
}

li{
padding:10px;
background:#f2f2f2;
margin:10px 0;
display:flex;
justify-content:space-between;
align-items:center;
border-radius:6px;
}

.edit{
background:orange;
}

.delete{
background:red;
}

</style>

</head>

<body>

<div class="container">

<h2>My To-Do List</h2>

<input id="task">

<button onclick="addTask()">Add</button>

<ul id="list"></ul>

</div>

<script>

let tasks=[];

function addTask(){

let text=document.getElementById("task").value;

if(text=="") return;

tasks.push({name:text});

document.getElementById("task").value="";

display();

}

function display(){

let ul=document.getElementById("list");

ul.innerHTML="";

tasks.forEach((task,index)=>{

ul.innerHTML+=`

<li>

${task.name}

<div>

<button class="edit" onclick="editTask(${index})">Edit</button>

<button class="delete" onclick="deleteTask(${index})">Delete</button>

</div>

</li>

`;

});

}

function editTask(i){

let t=prompt("Edit Task",tasks[i].name);

if(t!=null && t!=""){

tasks[i].name=t;

display();

}

}

function deleteTask(i){

tasks.splice(i,1);

display();

}

</script>

</body>
</html>
