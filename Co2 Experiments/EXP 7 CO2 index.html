<!DOCTYPE html>
<html>
<head>

<title>Online Quiz</title>

<style>

body{
font-family:Arial;
background:linear-gradient(to right,#36d1dc,#5b86e5);
}

.quiz{
width:600px;
margin:40px auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 0 15px gray;
}

h2{
text-align:center;
color:#003366;
}

.question{
margin-top:20px;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:green;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}

#result{
margin-top:20px;
font-size:22px;
text-align:center;
font-weight:bold;
}

</style>

</head>

<body>

<div class="quiz">

<h2>Online Quiz</h2>

<form id="quizForm">

<div class="question">

<p>1. HTML stands for?</p>

<input type="radio" name="q1" value="1">
HyperText Markup Language<br>

<input type="radio" name="q1" value="0">
High Transfer Machine Language

</div>

<div class="question">

<p>2. CSS is used for?</p>

<input type="radio" name="q2" value="1">
Styling Web Pages<br>

<input type="radio" name="q2" value="0">
Programming

</div>

<div class="question">

<p>3. JavaScript is a?</p>

<input type="radio" name="q3" value="1">
Scripting Language<br>

<input type="radio" name="q3" value="0">
Database

</div>

<button type="button" onclick="calculateScore()">
Submit Quiz
</button>

</form>

<div id="result"></div>

</div>

<script>

function calculateScore(){

let score=0;

let questions=["q1","q2","q3"];

questions.forEach(function(q){

let ans=document.querySelector('input[name="'+q+'"]:checked');

if(ans){

score+=Number(ans.value);

}

});

document.getElementById("result").innerHTML=

"Your Score : "+score+" / 3";

}

</script>

</body>
</html>
