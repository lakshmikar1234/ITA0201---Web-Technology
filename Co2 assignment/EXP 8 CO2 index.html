<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock & Exam Countdown</title>

<style>

body{
font-family:Arial;
margin:0;
background:linear-gradient(to right,#36d1dc,#5b86e5);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 0 20px gray;
text-align:center;
width:420px;
}

h1{
color:#003366;
}

#clock{
font-size:40px;
color:#0066cc;
margin:20px;
font-weight:bold;
}

#countdown{
font-size:25px;
color:red;
margin-top:20px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>Digital Clock</h1>

<div id="clock"></div>

<h2>Exam Countdown Timer</h2>

<div id="countdown"></div>

</div>

<script>

function updateClock(){

let now=new Date();

document.getElementById("clock").innerHTML=
now.toLocaleTimeString();

}

let examDate=new Date("December 31, 2026 09:00:00");

function updateCountdown(){

let now=new Date();

let diff=examDate-now;

if(diff<=0){

document.getElementById("countdown").innerHTML="Exam Started!";

return;

}

let days=Math.floor(diff/(1000*60*60*24));
let hours=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
let minutes=Math.floor((diff%(1000*60*60))/(1000*60));
let seconds=Math.floor((diff%(1000*60))/1000);

document.getElementById("countdown").innerHTML=
days+" Days "+hours+" Hours "+minutes+" Min "+seconds+" Sec";

}

setInterval(function(){

updateClock();
updateCountdown();

},1000);

</script>

</body>
</html>
