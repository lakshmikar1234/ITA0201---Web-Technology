<!DOCTYPE html>
<html>
<head>
    <title>GET and POST Form Demonstration</title>

    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right,#74ebd5,#ACB6E5);
        }

        h1{
            text-align:center;
            color:white;
            margin-top:20px;
        }

        .container{
            width:80%;
            margin:auto;
            display:flex;
            justify-content:space-around;
            margin-top:30px;
        }

        .card{
            width:40%;
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0px 0px 15px gray;
        }

        h2{
            text-align:center;
            color:#0066cc;
        }

        label{
            font-weight:bold;
        }

        input[type=text],
        input[type=email]{
            width:95%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid gray;
            border-radius:5px;
        }

        input[type=submit]{
            width:100%;
            padding:10px;
            background:#0066cc;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        input[type=submit]:hover{
            background:#004c99;
        }

        p{
            text-align:center;
            color:#333;
        }
    </style>

</head>

<body>

<h1>Demonstration of GET and POST Methods</h1>

<div class="container">

    <!-- GET FORM -->

    <div class="card">

        <h2>GET Method Form</h2>

        <form action="" method="GET">

            <label>Name</label><br>
            <input type="text" name="name" required>

            <label>Email</label><br>
            <input type="email" name="email" required>

            <input type="submit" value="Submit Using GET">

        </form>

        <p>
            ✔ Data entered in this form will be visible in the URL after submission.
        </p>

    </div>


    <!-- POST FORM -->

    <div class="card">

        <h2>POST Method Form</h2>

        <form action="" method="POST">

            <label>Name</label><br>
            <input type="text" name="name" required>

            <label>Email</label><br>
            <input type="email" name="email" required>

            <input type="submit" value="Submit Using POST">

        </form>

        <p>
            ✔ Data entered in this form is sent in the request body and is not shown in the URL.
        </p>

    </div>

</div>

</body>
</html>
